services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: sh -c "mvn -B -ntp -q -DskipTests install && mvn -B -ntp -pl airline-core spring-boot:run"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/airline
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - m2cache:/root/.m2

volumes:
  pgdata:
  m2cache:
