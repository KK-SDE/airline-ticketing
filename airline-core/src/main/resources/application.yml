spring:
  application:
    name: airlineTicketing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/airline}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

airline:
  booking-window-days: 365
  max-seats-per-booking: 9
  flight-generation:
    cron: "0 5 0 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
